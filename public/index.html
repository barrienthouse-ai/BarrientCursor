<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BarrientCursor · Todos</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>BarrientCursor</h1>
        <p class="subtitle">A minimal full-stack todo app.</p>
      </header>

      <form id="todo-form" class="todo-form" autocomplete="off">
        <input
          id="todo-input"
          name="title"
          type="text"
          placeholder="What needs doing?"
          aria-label="New todo"
          required
        />
        <button type="submit">Add</button>
      </form>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state">No todos yet — add one above.</p>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
